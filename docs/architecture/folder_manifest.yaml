version: 3.0
project_type: "iDirectory: Multi-Cloud, AI & Data Context Engineering Architecture"
created_by: Gravity HyperScale Thinking
manifest:
  01_seed: Semilla de proyecto y memoria técnica (ThinkingSeed Master). ADN arquitectónico del sistema.
  02_foundation/engine: "Núcleo del framework de automatización, lógica de ruteo, indexación y governance engine."
  03_research/notebooks: Notebooks de desarrollo interactivo (Jupyter/Colab/Fabric/Databricks) para análisis exploratorio (EDA).
  03_research/prompts: "Estructuras de prompts para LLMs, system prompts, árboles de contexto y plantillas de inferencia."
  03_research/experiments: "Pruebas de concepto (PoCs), prototipos de modelos algorítmicos, benchmarks e I+D."
  src/cloud_jobs: "Scripts productivos, pipelines y orquestación multi-cloud (Fabric PySpark, AWS Glue, GCP Dataproc, Azure Synapse)."
  src/data_generation: Módulos de generación y simulación de datos sintéticos con rigor probabilístico y volumetría estadística.
  src/core: "Lógica de negocio transversal, utilitarios de backend, clientes de servicios y módulos comunes."
  src/dashboards: "Tableros de Business Intelligence y apps de visualización interactiva (Streamlit, Dash, PowerBI, Looker)."
  artifacts/plans/active: "Planes de capacidad activos (F-SKUs), presupuestos cloud vigentes e hitos operativos en curso."
  artifacts/plans/archive: "Histórico de planes evaluados, arquitecturas descartadas y documentación obsoleta preservada por trazabilidad."
  docs/architecture: "Diagramas de arquitectura multi-cloud, topologías C4 y flujos de datos de las capas Medallion."
  docs/specs: "Especificaciones técnicas detalladas, linaje de datos, contratos de esquemas y requerimientos no funcionales."
  docs/notes: "Bitácoras de ingeniería, registro de deuda técnica, decisiones rápidas (ADRs) y análisis de causa raíz (RCA)."
  config: "Parámetros de entorno (dev, staging, prod) y variables de configuración desacopladas."
  data/raw: Zona de aterrizaje local (Bronze) para fuentes puras e inmutables. Ignorado en Git y AI.
  data/processed: Datos transformados localmente (Silver/Gold) en formatos estructurados (Parquet/Delta).
  data/sandbox: Entorno aislado para experimentación de científicos de datos y arquitectos.
  schemas: "Definiciones estrictas de esquemas (Avro, JSON Schema, DDL de SQL) para control de deriva de datos."
  scripts: "Scripts operativos del sistema operativo (bash, powershell, make) para tareas de mantenimiento."
  tests: "Suites de pruebas unitarias, integración y calidad de datos (Great Expectations / pytest)."
  tools: "Scripts utilitarios internos, herramientas de automatización local y linters."
  logs: "Trazas locales de ejecución, auditorías y dumps de errores."
  .context: "Directorio de telemetría, esquemas y mapas satelitales de Context Engineering de iDirectory."
routing_rules:
  .md: docs/notes
  .pdf: docs/specs
  .drawio: docs/architecture
  .png: docs/architecture
  .ipynb: 03_research/notebooks
  .py: src/cloud_jobs
  .sql: src/cloud_jobs
  .prompt: 03_research/prompts
  .pbix: src/dashboards
  .pbip: src/dashboards
  .yaml: config
  .yml: config
  .json: schemas
  .avsc: schemas
  .tf: infrastructure
  .csv: data/raw
  .parquet: data/processed
  .delta: data/processed
